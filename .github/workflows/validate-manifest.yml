name: Validate Manifest

on:
  workflow_call:
    inputs:
      manifest_path:
        description: "Path to manifest file (slice.yaml, loaf.yaml or grain.yaml, relative to repo root)"
        required: false
        type: string
        default: "slice.yaml"
      schema_ref:
        description: "bread-infra ref to use for schema (tag or branch)"
        required: false
        type: string
        default: "schema-v1.0"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4

      - name: Checkout bread-infra (schema + validator)
        uses: actions/checkout@v4
        with:
          repository: feastorg/bread-infra
          ref: ${{ inputs.schema_ref }}
          path: _bread-infra

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A bread-infra ref with uv.lock runs the validator on its locked dependencies.
      # Older refs (schema-v1.0 and the other 1.0 tags) predate the lock and keep the unpinned install.
      - name: Check for a lock file
        id: lock
        run: |
          if [ -f _bread-infra/uv.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: steps.lock.outputs.present == 'true'
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies (unpinned, refs without uv.lock)
        if: steps.lock.outputs.present != 'true'
        run: pip install pyyaml jsonschema

      - name: Validate manifest
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          LOCKED: ${{ steps.lock.outputs.present }}
        run: |
          if [ "$LOCKED" = true ]; then
            uv run --locked --no-dev --project _bread-infra \
              python _bread-infra/scripts/validate_manifest.py "$MANIFEST_PATH"
          else
            python _bread-infra/scripts/validate_manifest.py "$MANIFEST_PATH"
          fi
