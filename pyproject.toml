[project]
name = "bread-infra"
version = "0.1.0"
description = "Scripts, schemas and reusable workflows for BREAD Slice and Loaf repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.20",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pyright>=1.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
# Markdown: ruff would reformat the Python in specs' and RFCs' code blocks, which are laid out for reading.
# The two scripts are formatted in #26, which rewrites both; listed here so the two PRs do not conflict.
exclude = ["*.md", "scripts/validate_board.py", "tests/test_validate_board.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["scripts", "tests"]
# Typed in #26, which rewrites its imports.
ignore = ["tests/test_validate_board.py"]
